language: typescript

fileGroups:
  lexicons:
    - /lexicons/**/*.json


workspace:
  inheritedTasks:
    exclude:
    - start
    - dev
    - lint
    - lint-check
    - format
    - format-check
    - test
tasks:
  build:
    deps: []
    options:
      mergeDeps: replace
  generate:
    command: pnpm
    args:
    - exec
    - lex
    - build
    - --lexicons
    - ../../lexicons
    - --out
    - ./src/generated
    - --clear
    - --index-file
    - --defs-export
    outputs:
    - src/generated/
    options:
      interactive: true
    preset: server
