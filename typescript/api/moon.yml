language: typescript

fileGroups:
  lexicons:
    - /lexicons/**/*.json


workspace:
  inheritedTasks:
    exclude:
    - start
    - dev
    - lint
    - lint-check
    - format
    - format-check
    - test
tasks:
  build:
    deps: []
    options:
      mergeDeps: replace
  generate:
    command: pnpm
    args:
    - exec
    - lex
    - build
    - --lexicons
    - ../../lexicons
    - --out
    - ./src/generated
    - --clear
    # @atproto/lex's space schema types its collection list as one record
    # type, so a space type listing different records fails to typecheck.
    - --exclude
    - group.opensocial.meta
    - --exclude
    - group.opensocial.members
    - --exclude
    - group.opensocial.invites
    - --index-file
    - --defs-export
    outputs:
    - src/generated/
    options:
      interactive: true
    preset: server
