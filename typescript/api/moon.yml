language: typescript

fileGroups:
  lexicons:
    - /lexicons/**/*.json


workspace:
  inheritedTasks:
    exclude:
    - start
    - dev
    - lint
    - lint-check
    - format
    - format-check
tasks:
  build:
    deps: []
    options:
      mergeDeps: replace
  generate:
    command: pnpx
    args:
    - "@atproto/lex"
    - build
    - --lexicons
    - ../../lexicons
    - --out
    - ./src/generated
    - --index-file
    - --defs-export
    outputs:
    - src/generated/
    options:
      interactive: true
    preset: server
