layer: library
fileGroups:
  root_src:
    - internal/**/*.go
    - pkg/**/*.go
    - api/**/*.go
    - '!internal/**/*_test.go'
    - '!pkg/**/*_test.go'
  root_test:
    - internal/**/*.go
    - api/**/*.go
    - pkg/**/*.go
tasks:
  build:
    inputs:
      - '@group(mod)'
      - '@group(root_src)'
  test:
    inputs:
      - '@group(mod)'
      - '@group(root_test)'
  format:
    inputs:
      - '@group(root_test)'
  format-check:
    inputs:
      - '@group(root_test)'
  lint:
    inputs:
      - '@group(root_test)'
  lint-check:
    inputs:
      - '@group(root_test)'
  # `dev` is inherited from .moon/tasks/all.yml: `docker compose up --build`
  # with no profile, i.e. just the backing services.
  down:
    command: docker
    args: [compose, down]
    options:
      envFile: [/dev.env]
      runFromWorkspaceRoot: true
    preset: utility
  logs:
    command: docker
    args: [compose, logs, -f]
    options:
      envFile: [/dev.env]
      runFromWorkspaceRoot: true
    preset: server
