layer: library
fileGroups:
  root_src:
    - internal/**/*.go
    - pkg/**/*.go
    - api/**/*.go
    - '!internal/**/*_test.go'
    - '!pkg/**/*_test.go'
  root_test:
    - internal/**/*.go
    - api/**/*.go
    - pkg/**/*.go
tasks:
  build:
    inputs:
      - '@group(mod)'
      - '@group(root_src)'
  test:
    inputs:
      - '@group(mod)'
      - '@group(root_test)'
  format:
    inputs:
      - '@group(root_test)'
  format-check:
    inputs:
      - '@group(root_test)'
  lint:
    inputs:
      - '@group(root_test)'
  lint-check:
    inputs:
      - '@group(root_test)'
  caddy:
    command: caddy
    args:
    - run
    - --config
    - '@in(0)'
    inputs:
    - Caddyfile
    preset: server
