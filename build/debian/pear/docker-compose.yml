services:
  pear:
    # Release assets pin this default to the release's version. Set PEAR_TAG to
    # override it, e.g. PEAR_TAG=latest to track main.
    image: ghcr.io/habitat-network/pear:${PEAR_TAG:-latest}
    restart: unless-stopped
    dns:
      # Use public DNS instead of YunoHost's dnsmasq, which resolves local
      # domains to [::1] inside the container, breaking outbound HTTPS requests.
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${HABITAT_PORT:-8000}:${HABITAT_PORT:-8000}"
    volumes:
      - pear_data:/data
    environment:
      # Required: the publicly accessible domain for this server (no https:// prefix)
      HABITAT_DOMAIN: ${HABITAT_DOMAIN}
      # Optional: if unset, a random admin password is generated and printed on every boot.
      HABITAT_ADMIN_PASSWORD: ${HABITAT_ADMIN_PASSWORD:-}

      # Optional: the port the server listens on inside the container.
      HABITAT_PORT: ${HABITAT_PORT:-8000}

      # Optional: database connection string (default: sqlite:///data/repo.db).
      # For Postgres use postgres://user:password@host:5432/dbname.
      # The /data directory is a persistent volume — keep SQLite files under it.
      HABITAT_DB: ${HABITAT_DB:-sqlite:///data/repo.db}

      # Optional: blob storage (default: file:///data/blobs, on the persistent volume).
      # Also accepts s3://bucket?region=... or gs://bucket.
      HABITAT_BLOB_BUCKET: ${HABITAT_BLOB_BUCKET:-file:///data/blobs}

      # Optional: directory containing TLS certs (fullchain.pem + privkey.pem).
      # Leave unset if TLS is terminated upstream (e.g. by a reverse proxy like nginx).
      HABITAT_HTTPSCERTS: ${HABITAT_HTTPSCERTS:-}

      # Optional: enable Google Sign-In as a login method.
      HABITAT_GOOGLE_CLIENT_ID: ${HABITAT_GOOGLE_CLIENT_ID:-}
      HABITAT_GOOGLE_CLIENT_SECRET: ${HABITAT_GOOGLE_CLIENT_SECRET:-}

      # Optional: verbose request logging.
      HABITAT_DEBUG: ${HABITAT_DEBUG:-false}

      # The four keys below are auto-generated on first run and saved to
      # /data/.secrets.env inside the volume. You can override them by setting
      # these env vars explicitly (e.g. in a .env file next to this compose file).
      HABITAT_PDS_CRED_ENCRYPT_KEY: ${HABITAT_PDS_CRED_ENCRYPT_KEY:-}
      HABITAT_OAUTH_SERVER_SECRET: ${HABITAT_OAUTH_SERVER_SECRET:-}
      HABITAT_OAUTH_CLIENT_SECRET: ${HABITAT_OAUTH_CLIENT_SECRET:-}
      HABITAT_SPACE_SIGNING_KEY: ${HABITAT_SPACE_SIGNING_KEY:-}

volumes:
  pear_data:
