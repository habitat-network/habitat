name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - e2e/**
      - cmd/pear/**
      - internal/**
      - typescript/apps/pear-pages/**
      - .github/workflows/integration.yml

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup moon
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install Playwright browsers
        run: pnpm install --frozen-lockfile --filter e2e... && pnpm --dir e2e exec playwright install --with-deps chromium

      # Builds the pear image (via the harness), starts it in a testcontainer
      # and runs the Playwright suite. Run directly rather than through moon:
      # moon skips runInCI:false tasks when CI=true, which GitHub always sets.
      - name: Run integration tests
        run: pnpm --dir e2e exec playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
