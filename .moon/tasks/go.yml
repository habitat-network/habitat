$schema: https://moonrepo.dev/schemas/tasks.json
fileGroups:
  mod:
    - 'go.mod'
    - 'go.sum'
  src:
    - '**/*.go'
    - '!**/*_test.go'
  test:
    - '**/*.go'
tasks:
  format-check:
    command: golangci-lint fmt -d
    inputs:
      - /.golangci.yml
  format:
    command: golangci-lint fmt
    preset: utility
  lint-check:
    command: golangci-lint run
    inputs:
      - /.golangci.yml
  lint:
    command: golangci-lint run --fix
    preset: utility
  build:
    deps:
    - root:build
    inputs:
    - '@group(mod)'
    - '@group(src)'
    command: go 
    args:
    - build
    - -o
    - '@out(0)'
    outputs:
    - /bin/$project
  test:
    deps:
      - ~:build
    inputs:
    - '@group(mod)'
    - '@group(test)'
    command: go
    args:
    - test
    - ./...
  tidy-deps:
    command: go
    args:
    - mod
    - tidy
    preset: utility
  start:
    command: ./bin/$project
    deps:
    - ~:build
    options:
      runFromWorkspaceRoot: true
      envFile:
      - /dev.env
    preset: server
inheritedBy:
  toolchain: go
