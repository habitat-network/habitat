version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - sloglint
    - gocritic
  settings:
    sloglint:
      static-msg: true
      context: "all"
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - paramTypeCombine
        - rangeValCopy
        - importShadow
        - unnamedResult
        - ifElseChain
        - singleCaseSwitch
        - unnecessaryBlock
        - commentedOutCode
formatters:
  enable: golines
run:
  allow-parallel-runners: true
  # See the GOFLAGS note in .moon/tasks/go.yml.
  build-tags:
    - sqlite_fts5
