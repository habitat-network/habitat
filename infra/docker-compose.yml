services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: habitat
      POSTGRES_PASSWORD: habitat
      POSTGRES_DB: habitat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  meilisearch:
    image: getmeili/meilisearch:v1.54.0
    environment:
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

volumes:
  postgres_data:
  meilisearch_data:
