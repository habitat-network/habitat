# Playwright end-to-end tests against a real pear (see README in harness/pear.ts).
# Not part of `moon ci`: they need Docker (compose builds the pear and web client images).
layer: automation
language: typescript

workspace:
  inheritedTasks:
    exclude:
      - build

tasks:
  # Brings up the docker compose test bed (builds the pear and web client
  # images), then runs the suite against it. Pass Playwright args after `--`, e.g.
  #   moon run e2e:test -- tests/admin-login.spec.ts --headed
  test:
    command: pnpm
    args:
      - exec
      - playwright
      - test
    inputs:
      - /pnpm-lock.yaml
      - "**/*"
    options:
      runInCI: false
      cache: false
  typecheck:
    command: pnpm
    args:
      - exec
      - tsc
      - --noEmit
    inputs:
      - "**/*.ts"
      - tsconfig.json
